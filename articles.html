<script src="config.js"></script>
<script>
// ============================================================
//  ARTICLES LISTING — Parses the Articles sheet CSV
// ============================================================

function stripHtml(html) {
  if (!html) return "";
  return html.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
}
function extractFirstImage(html) {
  if (!html) return "";
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  return m ? m[1] : "";
}
function authorName(raw) {
  if (!raw) return "";
  return raw.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
function escHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function isTruthy(v) { return String(v || "").trim().toLowerCase() === "true"; }

// Smart crop for card cover images (mirrors index.html).
function smartCrop(img) {
  const wrap = img.closest(".card-image-wrap");
  if (!wrap) return;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return;
  const cw = wrap.clientWidth || wrap.offsetWidth || 1;
  const ch = wrap.clientHeight || wrap.offsetHeight || 1;
  img.style.objectPosition = (iw / ih) >= (cw / ch) ? "center center" : "center top";
}

function loadLocalAndRender() {
  fetch("articles.csv")
    .then(r => { if (!r.ok) throw new Error("articles.csv not found (HTTP " + r.status + ")"); return r.text(); })
    .then(text => {
      if (!text.trim()) throw new Error("articles.csv is empty");
      Papa.parse(text, { header: true, complete: res => renderFromData(res.data) });
    })
    .catch(renderError);
}

function loadAndRender() {
  if (!CONFIG.ARTICLES_CSV_URL || CONFIG.ARTICLES_CSV_URL.includes("YOUR_")) {
    loadLocalAndRender();
    return;
  }
  Papa.parse(CONFIG.ARTICLES_CSV_URL, {
    download: true, header: true,
    complete: res => {
      const valid = (res.data || []).filter(r => r["Name"] && r["Name"].trim());
      if (valid.length === 0) loadLocalAndRender(); else renderFromData(res.data);
    },
    error: () => loadLocalAndRender()
  });
}

function renderError(err) {
  document.getElementById("article-grid").innerHTML = `
    <div class="empty-state">
      <span class="emoji">⚙️</span>
      <h3>Couldn't load articles</h3>
      <p><strong>Error:</strong> ${escHtml(err && err.message || err || "Unknown error")}</p>
    </div>`;
}

function parseArticles(rows) {
  return rows
    .filter(r => r["Name"] && r["Name"].trim() && !isTruthy(r["Archived"]) && !isTruthy(r["Draft"]))
    .map(r => {
      const body = (r["Body"] || "").trim();
      return {
        name:      (r["Name"] || "").trim(),
        slug:      (r["Slug"] || "").trim(),
        author:    (r["Author"] || "").trim(),
        published: (r["Published On"] || "").trim(),
        body,
        image:     extractFirstImage(body),
        preview:   stripHtml(body).slice(0, 160),
      };
    })
    .sort((a, b) => a.name.localeCompare(b.name));
}

function renderCard(a) {
  const imageBlock = a.image ? `
    <div class="card-image-wrap">
      <img class="card-image" src="${escHtml(a.image)}" alt="${escHtml(a.name)}"
           loading="lazy" onload="smartCrop(this)" onerror="this.parentElement.remove()">
    </div>` : "";
  return `
    <a class="recipe-card${a.image ? "" : " no-image"}" href="article.html?id=${encodeURIComponent(a.slug)}">
      ${imageBlock}
      <div class="card-body">
        <div class="card-title">${escHtml(a.name)}</div>
        ${a.preview ? `<div class="card-desc">${escHtml(a.preview)}</div>` : ""}
        ${a.author ? `<div class="card-meta"><span class="card-author">&mdash; ${escHtml(authorName(a.author))}</span></div>` : ""}
      </div>
    </a>`;
}

function renderFromData(rows) {
  const articles = parseArticles(rows);
  const grid = document.getElementById("article-grid");
  const bar = document.getElementById("results-bar");

  if (articles.length === 0) {
    bar.textContent = "";
    grid.innerHTML = `
      <div class="empty-state">
        <span class="emoji">📖</span>
        <h3>No articles yet</h3>
        <p>Check back soon.</p>
      </div>`;
    return;
  }

  bar.textContent = `${articles.length} article${articles.length !== 1 ? "s" : ""}`;
  grid.innerHTML = articles.map(renderCard).join("");
}

loadAndRender();
</script>
