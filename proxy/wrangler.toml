name = "johnson-cookbook-proxy"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PHOTO_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Recipe photos uploaded from the admin page. Wrangler 4.45+ creates this
# namespace automatically on the first `wrangler deploy`.
[[kv_namespaces]]
binding = "PHOTOS"

# Avoid automatically recording proxy query URLs in invocation logs.
[observability.logs]
invocation_logs = false
